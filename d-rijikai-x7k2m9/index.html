<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>プロジェクト進捗ダッシュボード（保護）</title>
<style>
  body{font-family:"Yu Gothic UI","Meiryo",sans-serif;background:#f0f3f8;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;}
  .lock{background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:34px 30px;max-width:360px;width:90%;text-align:center;}
  .lock h1{font-size:17px;color:#1a3a6e;margin:0 0 6px;}
  .lock p{font-size:12px;color:#666;margin:0 0 18px;line-height:1.6;}
  .lock input{width:100%;padding:12px;font-size:15px;border:2px solid #cbd5e1;border-radius:8px;box-sizing:border-box;margin-bottom:12px;}
  .lock input:focus{outline:none;border-color:#2c5aa0;}
  .lock button{width:100%;padding:12px;font-size:15px;font-weight:bold;color:#fff;background:#2c5aa0;border:none;border-radius:8px;cursor:pointer;}
  .lock button:hover{background:#1a3a6e;}
  .err{color:#dc2626;font-size:12px;margin-top:10px;min-height:16px;}
  .lock .ico{font-size:40px;margin-bottom:8px;}
  .lock .rem{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#555;margin:0 0 12px;cursor:pointer;}
  .lock .rem input{width:auto;margin:0;padding:0;}
</style></head>
<body>
<div class="lock" id="lock">

  <h1>プロジェクト進捗ダッシュボード</h1>

  <label class="rem"><input type="checkbox" id="rem" checked> この端末では30日間パスワードを省略する</label>
  <button id="btn">表示する</button>
  <div class="err" id="err"></div>
</div>

      var html=new TextDecoder().decode(pt);
      ss(function(){sessionStorage.setItem(SK,pw);});
      if(!saved){ss(function(){
        if(document.getElementById('rem').checked){localStorage.setItem(LK,JSON.stringify({pw:pw,exp:Date.now()+DAYS*864e5}));}
        else{localStorage.removeItem(LK);}
      });}
      document.open();document.write(html);document.close();
    }catch(e){ err.textContent=saved?'':'パスワードが違います。'; }
  }
  document.getElementById('btn').addEventListener('click',function(){unlock();});
  document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
  var saved=ss(function(){
    var p=sessionStorage.getItem(SK); if(p)return p;
    var o=JSON.parse(localStorage.getItem(LK)||'null');
    if(o&&o.pw&&o.exp>Date.now())return o.pw;
    localStorage.removeItem(LK); return null;
  });
  if(saved){document.getElementById('pw').blur();unlock(saved);}
</script>
</body></html>
