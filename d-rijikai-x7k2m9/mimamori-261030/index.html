<style>
  body{font-family:"Yu Gothic UI","Meiryo",sans-serif;background:#f0f3f8;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;}
  .lock{background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:34px 30px;max-width:360px;width:90%;text-align:center;}

  .lock .ico{font-size:40px;margin-bottom:8px;}
  .lock .rem{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#555;margin:0 0 12px;cursor:pointer;}
  .lock .rem input{width:auto;margin:0;padding:0;}
</style></head>

  // 一度開けたら、同じタブを閉じるまではパスワードを聞かない（sessionStorage＝タブを閉じると消える）。
  // 「30日間省略」にチェックがあれば、この端末に30日間だけ覚える（localStorage・期限付き）。
  // LINEのトークからURLを開くたびに新しい画面になり、毎回パスワードを求められるのを防ぐため。
  var SK='rijikai_pw', LK='rijikai_pw_30d', DAYS=30;
  function ss(fn){try{return fn();}catch(e){return null;}}
  function b2u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
  async function unlock(saved){
    var pw=saved||document.getElementById('pw').value;
    var err=document.getElementById('err'); err.textContent='復号中…';
    try{
      var bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(SALT),iterations:ITER,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);

      var html=new TextDecoder().decode(pt);
      ss(function(){sessionStorage.setItem(SK,pw);});
      if(!saved){ss(function(){
        if(document.getElementById('rem').checked){localStorage.setItem(LK,JSON.stringify({pw:pw,exp:Date.now()+DAYS*864e5}));}
        else{localStorage.removeItem(LK);}
      });}
      document.open();document.write(html);document.close();
    }catch(e){ err.textContent=saved?'':'パスワードが違います。'; }
  }

  document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
  var saved=ss(function(){
    var p=sessionStorage.getItem(SK); if(p)return p;
